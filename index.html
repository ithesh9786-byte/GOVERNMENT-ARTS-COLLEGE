<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Government Arts College</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f5f5f5;
}

/* Header */
header{
    background:white;
    text-align:center;
    padding:20px;
}

header img{
    width:90px;
}

header h1{
    color:#002b5b;
}

header h3{
    color:#444;
}

/* Menu */
nav{
    background:#002b5b;
}

nav ul{
    display:flex;
    justify-content:center;
    list-style:none;
}

nav ul li{
    padding:15px 20px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-weight:bold;
}

/* Banner */
.banner{
    width:100%;
    height:500px;
    overflow:hidden;
    background:#ddd;
}

.banner img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* Upload Button */

.upload-box{
    text-align:center;
    margin:20px;
}

/* Stats */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    text-align:center;
    background:#0b2035;
    color:white;
}

.card{
    padding:30px;
    border-right:1px solid #555;
}

.card h2{
    font-size:45px;
}

footer{
    background:#002b5b;
    color:white;
    text-align:center;
    padding:15px;
}
</style>

</head>
<body>

<header>

<h1>GOVERNMENT ARTS COLLEGE (GRADE-I)</h1>

<h3>B-Mutlur, Chidambaram - 608102</h3>

</header>

<nav>
<ul>
<li><a href="#">HOME</a></li>
<li><a href="#">ABOUT</a></li>
<li><a href="#">DEPARTMENTS</a></li>
<li><a href="#">GALLERY</a></li>
<li><a href="#">PLACEMENT</a></li>
<li><a href="#">CONTACT</a></li>
</ul>
</nav>

<div class="upload-box">

<input type="file" id="upload" accept="image/*">

</div>

<div class="banner">

<img id="bannerImage" src="banner.jpg">

</div>

<section class="stats">

<div class="card">
<h2>14</h2>
<p>Departments</p>
</div>

<div class="card">
<h2>10</h2>
<p>PG Programmes</p>
</div>

<div class="card">
<h2>08</h2>
<p>Research</p>
</div>

<div class="card">
<h2>3517</h2>
<p>Total Students</p>
</div>

</section>

<footer>

© Government Arts College, B-Mutlur

</footer>

<script>

document.getElementById("upload").addEventListener("change",function(e){

const file=e.target.files[0];

if(file){

const reader=new FileReader();

reader.onload=function(event){

document.getElementById("bannerImage").src=event.target.result;

}

reader.readAsDataURL(file);

}

});

</script>

</body>
</html>
